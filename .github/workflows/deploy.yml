name: Deploy Release
on:
  release:
    types: [published]

jobs:
  build:
    name: Create And Upload Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@master

      - name: Build releases
        run: ./tools/deploy.sh ${{github.ref_name}}

      - name: Upload release (deScripts)
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          asset_name: deScripts-${{github.ref_name}}.zip
          file: release/deScripts-${{github.ref_name}}.zip

      - name: Upload release (Compositions)
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          asset_name: Compositions-${{github.ref_name}}.zip
          file: release/Compositions-${{github.ref_name}}.zip

      - name: Upload release (deScripts_Debug)
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          asset_name: deScripts_Debug-${{github.ref_name}}.zip
          file: release/deScripts_Debug-${{github.ref_name}}.zip

      - name: Upload release (deScripts_NoRadio)
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          asset_name: deScripts_NoRadio-${{github.ref_name}}.zip
          file: release/deScripts_NoRadio-${{github.ref_name}}.zip

      - name: Upload release (deScripts_NoLoadouts)
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          asset_name: deScripts_NoLoadouts-${{github.ref_name}}.zip
          file: release/deScripts_NoLoadouts-${{github.ref_name}}.zip

      - name: Upload CBA_Settings.sqf
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          asset_name: cba_settings.sqf
          file: release/cba_settings.sqf
